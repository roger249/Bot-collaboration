services:
  proposal-server:
    image: ${IMAGE_REPO:-ghcr.io/<org-or-user>/planbot-proposal-server}:${IMAGE_TAG:-latest}
    container_name: planbot_proposal_server
    restart: unless-stopped
    ports:
      - "8000:8000"
      # Data API simulator (used by the proposal server's REST adapter).
      - "8001:8001"
    environment:
      # LLM provider key required by the proposal endpoints (deepseek_tool).
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Data service endpoints + auth (overrides config_planbot.yaml).
      - DATA_CLIENT_BASE_URL=${DATA_CLIENT_BASE_URL:-}
      - DATA_PRODUCT_BASE_URL=${DATA_PRODUCT_BASE_URL:-}
      - BANK_API_KEY=${BANK_API_KEY:-}
      # Set to "0" to run the proposal server only (no bundled data simulator).
      - START_DATA_SERVER=${START_DATA_SERVER:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Persist logs and generated proposal artifacts.
      - ./log:/app/log
      - ./runs:/app/runs
      # Optional overrides; leave empty to use defaults baked in image.
      - ./config-override:/app/config-override:ro
      - ./data-override:/app/data-override:ro
