services:
  proposal-server:
    image: ${IMAGE_REPO:-ghcr.io/<org-or-user>/planbot-proposal-server}:${IMAGE_TAG:-latest}
    container_name: planbot_proposal_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Required by deepseek/poe providers configured in config/config.yaml.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Persist logs and generated proposal artifacts.
      - ./log:/app/log
      - ./runs:/app/runs
      # Optional overrides; leave empty to use defaults baked in image.
      - ./config-override:/app/config-override:ro
      - ./data-override:/app/data-override:ro
