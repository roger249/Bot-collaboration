# ═══════════════════════════════════════════════════════════════════════════
# Proposal Pipeline — configuration-driven prompt assembly (new)
# ═══════════════════════════════════════════════════════════════════════════

input_defaults:
  global:
    prompt_section: references
    required: false
  by_id:
    proposal_instructions:
      description: Instructions and format for generating the proposal
    section_guides:
      description: Detail instructions for specific sections in the proposal
    financial_needs_guidelines:
      description: Guidelines on financial needs analysis and common financial needs
    client_profile:
      source: api
      prompt_section: decision_context
      description: Client profile, wallet inflow event, and existing holdings for the target client
    product_catalog:
      source: api
      prompt_section: decision_context
      description: Investable products for the recommendation (suggested product, holdings, alternatives, and fitness scores)
    market_outlook:
      source: runtime_or_static
      description: Market outlook and sentiment analysis for the recommendation
    suggested_products_and_rationale:
      source: runtime_or_static
      prompt_section: references
      description: Suggested products, fitness scores, funding sources, and rationale for the recommended product
    web_references:
      description: Preferred websites and blocked domains for web retrieval

pipeline:

  # ── Product Investor Matching ───────────────────────────────────
  product_investor_matching:
    matcher:                                        # proposal-specific tuning (matcher only)
      readiness_pool_size: 15  # Pool size of top readiness clients to pass into fitness scoring
      llm_client_pool_size: 5  # Number of clients to pass into the LLM for final recommendation generation
      extract_patterns:
        # Regex patterns for _extract_top_pairs() markdown parsing.
        # Externalized so prompt format changes don't require code edits.
        client_id_re: "[A-Z]{2}-[A-Z]{2}-\\d{6,7}-\\d"
        product_id_re: "[A-Za-z]+[-.]?[\\w.-]+"
        amount_re: "USD\\s+\\$?([\\d,]+(?:\\.\\d+)?)"
        alternative_product_re: "-\\s+([A-Za-z]+[-.]?[\\w.-]+)\\s"

    execution:
      model: bacherlier_deepseek
      output:
        folder: runs/product_investor_matching
        filename_template: product_investor_matching_{date}.md
      logging:
        level: INFO

    inputs:
      - id: proposal_instructions
        source: file
        paths:
          - data/planbot/product_investor_matching/proposal_instructions/*.md
        prompt_section: references
        required: true
      - id: section_guides
        source: file
        paths:
          - data/planbot/shared/proposal_section_instructions/prod*.md
          - data/planbot/shared/proposal_section_instructions/sugg*.md
          - data/planbot/shared/proposal_section_instructions/ref*.md
        prompt_section: references
        required: true
      - id: financial_needs_guidelines
        source: file
        paths:
          - data/planbot/shared/financial_needs/*.md
        prompt_section: references
        required: true
      - id: client_profile
        required: true
        include:
          investor_readiness_score: true
      - id: product_catalog
        required: true
        include:
          product_fitness_scores: true
      - id: market_outlook
        sources:
          request: request.market_outlook_text
          static: data/planbot/shared/market_outlook/*.md
        default_source: request

    input_policy:
      missing_data:
        default: skip
      per_input:
        client_profile: error
        product_catalog: error

    prompt_packaging:
      llm_payload:
        include_references: true

    quality_gates:
      required_sections:
        - client_profile
        - product_catalog
      fail_on_missing_required_input: true

  # ── LLM Product Matcher (POC) ─────────────────────────────────────
  llm_product_matcher:
    execution:
      model: bacherlier_deepseek
      output:
        folder: runs/llm_product_matcher
        filename_template: llm_product_matcher_{date}.md
      logging:
        level: INFO

    inputs:
      - id: proposal_instructions
        source: file
        paths:
          - data/planbot/llm_product_matcher/proposal_instructions/*.md
        prompt_section: references
        required: true
      - id: section_guides
        source: file
        paths:
          - data/planbot/shared/proposal_section_instructions/sugg*.md
          - data/planbot/shared/proposal_section_instructions/prod*.md
          - data/planbot/shared/proposal_section_instructions/ref*.md
        prompt_section: references
        required: true
      - id: financial_needs_guidelines
        source: file
        paths:
          - data/planbot/shared/financial_needs/*.md
        prompt_section: references
        required: true
      - id: web_references
        source: file
        paths:
          - data/planbot/shared/web_references/*.md
        prompt_section: references
        required: false
      - id: client_profile
        required: true
        include:
          investor_readiness_score: true   # readiness score + RM notes fed as reference (no IRS gate)
      - id: market_outlook
        source: runtime_or_static   # explicit — drives the `sources`/`default_source` resolution
        sources:
          request: request.market_outlook_text
          static: data/planbot/shared/market_outlook/*.md
        default_source: request

    input_policy:
      missing_data:
        default: skip
      per_input:
        client_profile: error

    prompt_packaging:
      llm_payload:
        include_references: true

    quality_gates:
      required_sections:
        - client_profile
      fail_on_missing_required_input: true

  # ── Reinvestment Proposal ──────────────────────────────────────────
  reinvestment:
    execution:
      model: bacherlier_deepseek
      output:
        folder: runs/reinvestment_proposal
        filename_template: reinvestment_{client_id}_{date}.md
      logging:
        level: INFO

    inputs:
      - id: proposal_instructions
        source: file
        paths:
          - data/planbot/reinvestment/proposal_instructions/*.md
        prompt_section: references
        required: true
      - id: section_guides
        source: file
        paths:
          - data/planbot/shared/proposal_section_instructions/suggested_portfolio_instruction.md
        prompt_section: references
        required: true
      - id: financial_needs_guidelines
        source: file
        paths:
          - data/planbot/shared/financial_needs/*.md
        prompt_section: references
        required: true
      - id: client_profile
        required: true
        include:
          investor_readiness_score: true
          wallet_inflow_event: true
      - id: product_catalog
        required: true
        include:
          product_fitness_scores: true
      - id: market_outlook
        sources:
          request: request.market_outlook_text
          static: data/planbot/shared/market_outlook/*.md
        default_source: request

    input_policy:
      missing_data:
        default: error

    prompt_packaging:
      llm_payload:
        include_references: true

    quality_gates:
      required_sections:
        - client_profile
        - product_catalog
      fail_on_missing_required_input: true

  # ── Product Opportunity Proposal ──────────────────────────────────
  product_opportunity:
    execution:
      model: bacherlier_deepseek
      output:
        folder: runs/product_opportunity_proposal
        filename_template: product_opportunity_{client_id}_{date}.md
      logging:
        level: INFO

    inputs:
      - id: proposal_instructions
        source: file
        paths:
          - data/planbot/product_opportunity/proposal_instructions/*.md
        prompt_section: references
        required: true
      - id: section_guides
        source: file
        paths:
          - data/planbot/shared/proposal_section_instructions/p*.md
          - data/planbot/shared/proposal_section_instructions/ref*.md
          - data/planbot/shared/proposal_section_instructions/s*.md
        prompt_section: references
        required: true
      - id: financial_needs_guidelines
        source: file
        paths:
          - data/planbot/shared/financial_needs/*.md
        prompt_section: references
        required: true
      - id: client_profile
        required: true
      - id: product_catalog
        required: true
        include:
          product_fitness_scores: true
      - id: suggested_products_and_rationale
        source_priority:
          - request.suggested_products_and_rationale
          - data/planbot/product_opportunity/suggested_products/*.md
      - id: market_outlook
        sources:
          request: request.market_outlook_text
          static: data/planbot/shared/market_outlook/*.md
        default_source: request

    input_policy:
      missing_data:
        default: skip
      per_input:
        client_profile: error
        product_catalog: error
        suggested_products_and_rationale: fallback_to_static

    prompt_packaging:
      llm_payload:
        include_references: true

    quality_gates:
      required_sections:
        - client_profile
        - product_catalog
      fail_on_missing_required_input: true

  # ── Portfolio Review ──────────────────────────────────────────────
  portfolio_review:
    execution:
      model: bacherlier_deepseek
      output:
        folder: runs/portfolio_review
        filename_template: portfolio_review_{client_id}_{date}.md
      logging:
        level: INFO

    inputs:
      - id: proposal_instructions
        source: file
        paths:
          - data/planbot/portfolio_review/proposal_instructions/*.md
        prompt_section: references
        required: true
      - id: section_guides
        source: file
        paths:
          - data/planbot/shared/proposal_section_instructions/*.md
        prompt_section: references
        required: true
      - id: financial_needs_guidelines
        source: file
        paths:
          - data/planbot/shared/financial_needs/*.md
        prompt_section: references
        required: true
      - id: web_references
        source: file
        paths:
          - data/planbot/shared/web_references/*.md
        prompt_section: references
        required: false
      - id: client_profile
        required: true
      - id: product_catalog
        required: true
      - id: market_outlook
        sources:
          request: request.market_outlook_text
          static: data/planbot/shared/market_outlook/*.md
        default_source: request

    input_policy:
      missing_data:
        default: skip
      per_input:
        client_profile: error
        product_catalog: error

    prompt_packaging:
      llm_payload:
        include_references: true

    quality_gates:
      required_sections:
        - client_profile
        - product_catalog
      fail_on_missing_required_input: true