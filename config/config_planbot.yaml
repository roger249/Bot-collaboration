# Configuration for PlanBot, a bot designed for portfolio review and client suitability analysis in the financial domain.

common:
# Below are default folder locations to use unless it's specified in the individual proposal section.  In such case, the
# setting in the proposal section will override the common setting
  crewai_config_folder: config/crewai/planbot
  cleanup_temp_files: false # If true, temporary files generated during processing will be deleted after use.  If false, they will be kept for debugging.
  # false → client/product data read from DuckDB (self-contained); true → bank REST adapters (see data_source.rest below).
  get_client_product_from_restapi: false

# Data Access Layer backends (Sprint 2) — consumed by ``build_data_adapters``.
# ``get_client_product_from_restapi`` above selects DuckDB (false) vs. REST (true).
data_source:
  duckdb:
    path: data/planbot/db/planbot.duckdb
  # REST is only read when ``get_client_product_from_restapi: true``.  Fill in
  # the real bank endpoints + auth token env before switching the flag on.
  rest:
    # base_url is the host root; the resource paths below are appended.
    client_base_url: http://localhost:8001
    product_base_url: http://localhost:8001
    clients_path: /api/v1/clients
    holdings_path: /api/v1/holdings
    products_path: /api/v1/products
    auth_token_env: BANK_API_KEY
    timeout_seconds: 10
    cache_ttl_seconds: 10    # per-entry cache expiry (0 = disable cache)
    cache_maxsize: 512        # max cached entries per adapter

# LLM call cache — LiteLLM in-memory cache for the CrewAI proposal path.
# Caches successful completions keyed by LiteLLM (model + messages + base_url).
# Process-local: a restart yields an empty cache.
llm_cache:
  enabled: true             # master switch
  ttl_seconds: 86400        # global TTL in seconds (0 = disable); 24h default

# Demo control endpoints (/api/v1/demo/*) — HTTP-only test-data mutation/reset
# for demos and tests.  Disabled (404) when `enabled: false`.  DuckDB mode only.
demo_tools:
  enabled: true

# Server bind settings — consumed by data_server and proposal_server __main__ blocks.
# Not used by the monolithic server.py (kept for backward compatibility).
server:
  data:
    host: "127.0.0.1"
    port: 8001
  proposal:
    host: "127.0.0.1"
    port: 8000

stock_analysis_proposal:
  task: stock_analysis_proposal_task
  data_root: data/planbot/stock_analysis
  crewai_config_folder: data/planbot/stock_analysis/crewai
  references_root: data/planbot/stock_analysis
  output_root: runs/stock_analysis
  output_filename: stock_analysis_proposal.md
  references:
    proposal_instructions_and_format:
      - name: proposal_instructions/*.md
        purpose: Instructions and format for generating the proposal
    news_and_data:
      - name: news_and_data/**/*.md
        purpose: Recent news and data for the stock analysis
  llm_model: poe_gemini 
  # deepseek_tool (deepseek-v4-flash) ignores CrewAI ReAct stop-sequences and returns Final Answer immediately

llm_models:
  bacherlier_deepseek:
    provider: bacherlier
    model: deepseek-v4-flash-0731
    temperature: 0.1
  deepseek_tool:
    provider: deepseek
    model: deepseek-v4-flash
    # model: deepseek-v4-pro. never returns
  poe_deepseek_tool:
    provider: poe
    # model: deepseek-v4-pro-t # emit the stupid thinking, couldn't use
    # model: minimax-m2.7-fw # emit the stupid thinking, couldn't use
    model: qwen3-235b-a22b-n
    temperature: 0.2
  poe_qwen:
    provider: poe
    model: qwen3.5-397b-a17b-t
    # model: qwen3.6-plus
    temperature: 0.1
  poe_deepseek:
    provider: poe
    model: deepseek-v3.2-exp
    # model: deepseek-v3.2-fw
    # model: deepseek-v4-pro-t # emit the stupid thinking, couldn't use
    temperature: 0.2
  poe_gemini:
    provider: poe
    model: gemini-3.1-flash-lite
    temperature: 0.1
  poe_free:
    provider: poe
    model: gemma-4-31b
    temperature: 0.1
  poe_phi:
    provider: poe
    model: phi-4-di
    temperature: 0.1   
  or_gemma:
    provider: openrouter
    model: google/gemma-4-31b-it:free
    temperature: 0.1
  # model: google/gemma-4-31b-it:free
  # model: qwen/qwen3-next-80b-a3b-instruct:free
  mock:
    provider: mock
    model: mock

investor_readiness_score:
  output:
    file: runs/investor_readiness_score/scores.csv
    duckdb: data/planbot/db/planbot.duckdb
  score_cash_drag:
    weight: 1
    pivot:
      0.0: 0
      0.2: 3
      0.5: 9
      1.0: 10
  score_concentration_risk:
    weight: 1
    # Each pivot maps a concentration ratio (x) to a risk score (y) on a 0-10
    # scale, linearly interpolated between the two keys.  The first key is the
    # "safe" threshold (score 0), the second is the "fully concentrated" ceiling
    # (score 10).  The final concentration risk = max() of the three sub-scores.
    s_single_holding:
      # 0.2: 0  → a single holding ≤ 20% of AUM adds no concentration risk.
      # 1.0: 10 → a single holding = 100% of AUM is max risk (score 10).
      0.2: 0
      1.0: 10
    s_region_exposure:
      # 0.4: 0  → ≤ 40% in one region is safe; 1.0 (all in one region) = 10.
      0.4: 0
      1.0: 10
    s_asset_class_exposure:
      # 0.6: 0  → ≤ 60% in one asset class is safe; 1.0 (all one class) = 10.
      0.6: 0
      1.0: 10
  score_active_manage:
    weight: 1
    has_fund: 3
  score_life_stage:
    weight: 1
    pivot:
      25: 0
      35: 5
      45: 10
      65: 10
      80: 5

product_fitness_score:
# Product fitness score configuration — weights, sigmas, and parameters for
# search_similar, search_reinvestment_candidates, and search_product_by_fitness_score.
# All score constants are defined here; the implementation must not hard-code them.
  search_similar_weights:
    risk_rating: 0.25
    expected_return: 0.20
    product_type: 0.15       # soft-scored only — never a hard filter
    asset_class: 0.10
    region: 0.10
    sector: 0.05
    time_to_maturity: 0.10
    coupon: 0.05
  search_similar_sigmas:
# Per-dimension scale for numeric similarity: s_i = 1 - min(|x - q| / sigma, 1).
# If omitted, sigma_i falls back to population std dev from the products table.
    risk_rating: 2.0
    expected_return: 5.0
    time_to_maturity: 730.0   # days (~2 years)
    coupon: 2.0
  product_fitness_weights:
# Weights for the 8 PFS dimensions (4 structured + 4 semantic similarity).
# Renormalized when dimensions are excluded.
    risk_rating_match_score: 0.25
    diversification_score: 0.1
    has_similar_investment_experience_score: 0 # The score now move to similarity_to_current_holdin
    better_product_score: 0.15
    similarity_product_note_in_like_products: 0.1
    similarity_product_note_in_dislike_products: 0.1  # inverted term — higher = not disliked
    similarity_to_current_holding: 0.1
    similarity_to_RM_note: 0.2
  product_fitness_params:
    better_product_score_scale: 10
    better_product_score_uplift_cap: 0.30
    better_product_score_eps: 0.01
    concentration_test_position_pct_aum: 0.10  # % of AUM used as hypothetical test position
    experience_score_same_type: 10.0            # high: same product_type held
    experience_score_same_family: 6.0           # medium: same product_family held
    experience_score_none: 0.0                  # low: no match

