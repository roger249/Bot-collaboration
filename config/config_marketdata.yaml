# The rating is assigned by running thru the following table from top the bottom, for example, if the downside deviation is 15%, it will run thru the row until the number on the right hand side is more than 15%.  The same logic applies to all other rating tables
risk_rating:
  - 1: 1%
  - 2: 4%
  - 3: 10%
  - 4: 20%
  - 5: 

# 30%, 50%, 70%, 85%, 95%
certainty_rating:
  - 1: 30%
  - 2: 50%
  - 3: 70%
  - 4: 85%
  - 5: 95%

certainty_period:
- 1y
- 3y
- 8y

# Certainty computation:
#   certainty_enabled: false skips generating certainty columns entirely.
#   Formula: z = √T · (r − μ) / σ, where r = certainty_target_return (fixed target %, e.g. 0 = break-even).
#   The z-score is rated via the certainty_rating table (top-to-bottom first-match).
certainty_enabled: false
certainty_target_return: 0

# Liquidity rating based on asset type / quote type from Yahoo Finance.
# Keys are matched case-insensitively against quoteType and asset_class fields.
# Falls back to volume-based estimation if no mapping matches.
liquidity_rating:
  etf: 5
  equity: 5
  currency: 5
  future: 5
  index: 5
  mutualfund: 4
  bond: 4
  structured: 3
  annuity: 3
  realestate: 2
  privateequity: 1
# ---------------------------------------------------------------------------
# duckdb_ticker_groups — Holdings products that need bridge rows in the
# products table.  The seeder creates STOCK-{ticker} / ETF-{ticker} rows,
# but client holdings may use different product_id values (e.g. "1810-hk"
# vs "STOCK-1810.HK").  Each entry here creates a second products row with
# the holdings-compatible product_id.
#
# Fields:
#   product_id (required)  — exact product_id used in the holdings table
#   ticker     (required)  — Yahoo Finance symbol for market data lookup
#   name, sector (optional) — fallback when Yahoo returns no metadata
# ---------------------------------------------------------------------------
duckdb_ticker_groups:

  holdings_stocks:
    description: "Stocks in client holdings that need product_id bridge rows"
    product_type: "stock"
    entries:
      - product_id: "1810-hk"
        ticker: "1810.HK"
        # Below are optional, and act as fallback if yahoo not available.
        # name: "Xiaomi Corporation"
        # sector: "Technology"
      - product_id: "brka"
        ticker: "BRK-A"
      - product_id: "2018-hk"
        ticker: "2018.HK"

  holdings_treasury_yields:
    description: "Treasury yield instruments held by clients — proxied via BondBloxx target-duration ETFs"
    product_type: "bond"
    entries:
      - product_id: "us3yt-rr"
        ticker: "XTRE"
        name: "US 3-Year Treasury Yield"
        sector: "Government"
      - product_id: "us5yt-rr"
        ticker: "XFIV"
        name: "US 5-Year Treasury Yield"
        sector: "Government"
      - product_id: "us7yt-rr"
        ticker: "XSVN"
        name: "US 7-Year Treasury Yield"
        sector: "Government"

  holdings_treasury_bills:
    description: "Treasury bill instruments held by clients — proxied via BondBloxx 6-Month ETF"
    product_type: "money_market_fund"
    entries:
      - product_id: "PROD053"
        ticker: "XHLF"
        name: "US 1-Month Treasury Bill Rate"
        sector: "Government"
      - product_id: "us2mt-x"
        ticker: "XHLF"
        name: "US 2-Month Treasury Bill"
        sector: "Government"
      - product_id: "us3mt-rr"
        ticker: "XHLF"
        name: "US 3-Month Treasury Bill Rate"
        sector: "Government"
      - product_id: "PROD054"
        ticker: "XHLF"
        name: "US 4-Month Treasury Bill"
        sector: "Government"

  holdings_fx:
    description: "FX instruments held by clients"
    product_type: "currency"
    entries:
      - product_id: "eur-usd"
        ticker: "EURUSD=X"
        name: "Euro / US Dollar"
        sector: "FX"

