# Logging configuration for the bot collaboration framework
#
# Every level is a literal value (DEBUG/INFO/WARNING/ERROR) — no %(…)s
# placeholders.  This file is self-contained: fileConfig('path/to/this.ini')
# works with no defaults dict.

[loggers]
keys=root,chat_history,src.integrations,crewai_trace

[handlers]
keys=consoleHandler,fileHandler,chatHistoryFileHandler,crewaiTraceFileHandler

[formatters]
keys=defaultFormatter,consoleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_chat_history]
level=DEBUG
handlers=chatHistoryFileHandler
qualname=chat_history
propagate=0

[logger_src.integrations]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=src.integrations
propagate=0

[logger_crewai_trace]
level=INFO
handlers=crewaiTraceFileHandler
qualname=crewai_trace
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('log/planbot.log', 'w', 'utf-8')
kwargs={'delay': True}

[handler_chatHistoryFileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('log/chat_history.log', 'w', 'utf-8')
kwargs={'delay': True}

[handler_crewaiTraceFileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('log/crewai_trace.log', 'w', 'utf-8')
kwargs={'delay': True}

[formatter_defaultFormatter]
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_consoleFormatter]
format=%(asctime)s %(message)s
datefmt=%H:%M:%S
