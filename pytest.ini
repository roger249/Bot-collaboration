[pytest]
markers =
    slow: marks tests that are slow (invoke real LLM via CrewAI); skipped by default, use --run-slow to include
    integration: marks tests that require live external services (Yahoo Finance, web scraping, etc.)
    e2e: marks end-to-end tests that exercise full real pipeline
    demo: demo-flow tests that exercise the real proposal pipeline (require --run-slow)
    parallel: tests safe to run concurrently against the proposal server (real-LLM only; no monkeypatched server state)
