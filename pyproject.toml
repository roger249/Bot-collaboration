[project]
name = "planbot-proposal-server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cachetools>=7.1.7",
    "crawl4ai==0.8.6",
    "crewai==1.14.4",
    "crewai-tools==1.14.4",
    "duckdb==1.5.4",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "markitdown==0.1.5",
    "playwright==1.59.0",
    "pydantic==2.11.10",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "sentence-transformers>=6.0.0",
    "torch>=2.2",
    "uvicorn==0.46.0",
    "yfinance==1.3.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]

# Pin torch to the CPU-only build **on Linux only** so the Docker image stays
# lean (the default PyPI torch wheels pull in the full CUDA runtime, ~7+ GB).
# On macOS, torch already ships CPU/MPS-only from PyPI, so it keeps the default
# index.  The CPU index is marked `explicit` so only `torch` resolves from it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
