product_investor_matching_task:

  agent: investment_advisor_agent

  description: |

    - Given a list of clients and investable products, generate a product-fit based on each client's financial needs and risk profile.
    - **Only recommend products that have a fitness score entry** in the per-client Product Fitness Scores tables.  Products listed in the product catalog detail section without a corresponding fitness score row are existing client holdings shown for context only — do not recommend them as the suggested product.
    - Avoid matching product with low Fitness Scores, in particular a concentration score (>9)
    - Each product shall suggest to no more than 5 clients to ensure the diversification of the recommendation.
    - Use the Product Fitness Scores table at the end of the product catalog section. Prefer products with higher fitness scores for each client. The fitness score is computed from risk-rating match, concentration impact, investment experience, and relative return uplift — treat it as a quantitative starting point for your recommendation
    - The reference materials are provided at the end of the user prompt as structured JSON that includes below:
      - proposal_instructions: Instructions and format for generating the proposal
      - section_guides: Detail instructions for specific sections
      - client_profile: list of client profile and existing holdings.  Each client profile includes their Investor Readiness Score with component breakdown — use this to prioritize clients most likely to transact.
      - product_catalog: investable assets available for recommendation.  Includes per-client Product Fitness Scores tables at the end — use these as quantitative input for product selection.
      - financial_needs_guidelines: a list of the common needs
      - market_outlook: market outlook  
  expected_output: |

    A product investor matching report in markdown format that:
    - All output begins exactly with the line: "---** Output of suggestion as below **---"
    - The instruction and the sections in the proposal is in references/proposal_instructions/proposal_format.md.  Please strictly follow the format and the sections in the proposal instructions.
    - Includes one recommendation per client with a 1-5 suitability score and justification.
    - Keep all references material at the reference section.
    - Do not include YAML blocks, extra sections, or commentary.